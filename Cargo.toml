[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow2 = { version = "0.18.0", default-features = false, features = ["io_parquet"] }
rayon = "1.10"
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
